title: SkuggeAI Nyheter
# Eksplisitt (ellers fylt inn av github-metadata på Pages) — RSS-feeden trenger absolutte URL-er
url: "https://skuggemannen.github.io"
baseurl: "/skuggeai-news"
paginate: 8
paginate_path: "/side:num/"
collections:
  galleri:
    output: false
  v5:                       # eksperimentell v5-utgave (10/10-2026), egen seksjon, ikke på forsiden/RSS
    output: true
    permalink: /v5/:name/
plugins:
  - jekyll-paginate
