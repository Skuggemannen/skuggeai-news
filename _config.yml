title: SkuggeAI Nyheter
# Eksplisitt (ellers fylt inn av github-metadata på Pages) — RSS-feeden trenger absolutte URL-er
url: "https://skuggemannen.github.io"
baseurl: "/skuggeai-news"
paginate: 8
paginate_path: "/side:num/"
collections:
  galleri:
    output: false
  uka:                      # ukeutgaven (fra 26/10-2026, v5/uke.py)
    output: true
    permalink: /uka/:name/
  v5:                       # utprøvingen av den saksvise metoden 10.–16/10-2026 (arkiv); fra 17/10 er den forsiden
    output: true
    permalink: /v5/:name/
plugins:
  - jekyll-paginate
